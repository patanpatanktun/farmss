<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarMMS - 회원가입</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Pretendard 폰트 적용 */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: "Pretendard Variable", Pretendard, sans-serif; }
  </style>
</head>
<body class="bg-slate-100/70 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- 상단 헤더: 다른 페이지와 동일한 로고 디자인 적용 -->
  <header class="w-full bg-white border-b border-gray-200">
    <div class="max-w-[1360px] mx-auto px-10 py-5 flex items-center justify-between">
      <a href="start.html" class="flex items-center gap-2">
        <span class="text-emerald-800 font-extrabold text-lg tracking-tight">FarMMS</span>
        <span class="text-gray-300">|</span>
        <span class="text-gray-500 font-medium text-xs">농업의 가치를 더하다</span>
      </a>
       <div class="text-sm font-semibold text-gray-600">
        <a href="start.html" class="inline-flex items-center gap-1.5 text-emerald-800 font-bold hover:underline">
          <img src="images/sample-mms2.png" alt="홈 아이콘" class="w-4 h-4 object-contain">
          홈으로 돌아가기
        </a>
      </div>
    </div>
  </header>

  <!-- 본문 회원가입 폼 영역 -->
  <main class="max-w-xl mx-auto px-6 py-12 w-full flex-1 flex items-center justify-center">
    <div class="bg-white rounded-3xl border border-gray-200 p-10 shadow-sm w-full space-y-8">
      
      <!-- 타이틀 -->
      <div class="text-center space-y-2">
        <h1 class="text-3xl font-black text-gray-900 tracking-tight">회원가입</h1>
        <p class="text-gray-500 font-medium text-sm">FarMMS와 함께 스마트한 농업 관리를 시작하세요.</p>
      </div>

      <!-- 입력 폼 -->
      <form class="space-y-5">
        
        <!-- 이름 -->
        <div class="space-y-2">
          <label class="block text-sm font-bold text-gray-800">이름</label>
          <input type="text" placeholder="홍길동"
                 class="w-full px-4 py-3.5 text-base border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100 transition-all font-medium text-gray-800">
        </div>

        <!-- 성별 선택 -->
        <div class="space-y-2">
          <label class="block text-sm font-bold text-gray-800">성별</label>
          <div class="grid grid-cols-2 gap-4">
            <label class="flex items-center justify-center px-4 py-3.5 border-2 border-gray-200 rounded-2xl cursor-pointer hover:border-emerald-700 hover:bg-emerald-50/30 transition-all has-[:checked]:border-emerald-700 has-[:checked]:bg-emerald-50 font-bold text-gray-700">
              <input type="radio" name="gender" value="male" class="w-4 h-4 text-emerald-800 focus:ring-emerald-500 mr-2"> 남자
            </label>
            <label class="flex items-center justify-center px-4 py-3.5 border-2 border-gray-200 rounded-2xl cursor-pointer hover:border-emerald-700 hover:bg-emerald-50/30 transition-all has-[:checked]:border-emerald-700 has-[:checked]:bg-emerald-50 font-bold text-gray-700">
              <input type="radio" name="gender" value="female" class="w-4 h-4 text-emerald-800 focus:ring-emerald-500 mr-2"> 여자
            </label>
          </div>
        </div>

        <!-- 생년월일 (년 / 월 / 일 칸 분리 및 스크롤 선택 지원) -->
        <div class="space-y-2">
          <label class="block text-sm font-bold text-gray-800">생년월일</label>
          <div class="grid grid-cols-3 gap-3">
            <input type="number" placeholder="년 (YYYY)" min="1900" max="2100"
                   class="w-full px-4 py-3.5 text-base border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100 transition-all font-medium text-gray-800 text-center">
            <select class="w-full px-4 py-3.5 text-base border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100 transition-all font-medium text-gray-800 bg-white text-center">
              <option value="" disabled selected>월</option>
              <option value="01">1월</option>
              <option value="02">2월</option>
              <option value="03">3월</option>
              <option value="04">4월</option>
              <option value="05">5월</option>
              <option value="06">6월</option>
              <option value="07">7월</option>
              <option value="08">8월</option>
              <option value="09">9월</option>
              <option value="10">10월</option>
              <option value="11">11월</option>
              <option value="12">12월</option>
            </select>
            <input type="number" placeholder="일 (DD)" min="1" max="31"
                   class="w-full px-4 py-3.5 text-base border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100 transition-all font-medium text-gray-800 text-center">
          </div>
        </div>

        <!-- 휴대폰 번호 -->
        <div class="space-y-2">
          <label class="block text-sm font-bold text-gray-800">휴대폰 번호</label>
          <input type="text" placeholder="'-' 없이 숫자만 입력"
                 class="w-full px-4 py-3.5 text-base border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100 transition-all font-medium text-gray-800">
        </div>

        <!-- 아이디 -->
        <div class="space-y-2">
          <label class="block text-sm font-bold text-gray-800">아이디</label>
          <div class="flex gap-3">
            <input type="text" placeholder="아이디를 입력하세요"
                   class="flex-1 px-4 py-3.5 text-base border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100 transition-all font-medium text-gray-800">
            <button type="button" class="px-5 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-sm rounded-2xl transition-colors whitespace-nowrap">중복확인</button>
          </div>
        </div>

        <!-- 비밀번호 -->
        <div class="space-y-2">
          <label class="block text-sm font-bold text-gray-800">비밀번호</label>
          <input type="password" placeholder="영문, 숫자, 특수문자 조합 8자리 이상"
                 class="w-full px-4 py-3.5 text-base border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100 transition-all font-medium text-gray-800">
        </div>

        <!-- 비밀번호 확인 -->
        <div class="space-y-2">
          <label class="block text-sm font-bold text-gray-800">비밀번호 확인</label>
          <input type="password" placeholder="비밀번호를 한번 더 입력하세요"
                 class="w-full px-4 py-3.5 text-base border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100 transition-all font-medium text-gray-800">
        </div>

      	<!-- 가입하기 버튼 -->
		<a href="login.html" class="block w-full py-4 bg-emerald-800 hover:bg-emerald-900 text-white font-extrabold text-lg rounded-2xl shadow-md transition-all hover:shadow-lg active:scale-[0.99] mt-2 text-center">
  			가입 완료하기
		</a>

      </form>

    </div>
  </main>

  <!-- 푸터 -->
  <footer class="w-full bg-white border-t border-gray-200 py-6 px-10 text-center text-gray-400 text-xs">
    <p>© 2026 FarMMS. All rights reserved.</p>
  </footer>

</body>
</html>
