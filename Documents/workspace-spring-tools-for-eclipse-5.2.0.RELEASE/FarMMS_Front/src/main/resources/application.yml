# 공통 설정 파일입니다.
server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    # 기본 실행 시 H2 메모리 DB를 사용하는 local 프로필을 활성화합니다.
    active: mysql

  jpa:
    # Controller에서 Entity의 지연 로딩이 실행되는 것을 막습니다.
    # Service 계층에서 필요한 데이터를 모두 조회하도록 유도하는 설정입니다.
    open-in-view: false

logging:
  level:
    # 프로젝트 패키지의 로그를 확인하기 위한 설정입니다.
    com.farmms.backend: debug

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 28800000
