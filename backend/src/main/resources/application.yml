spring:
  application:
    name: farmss-ai-mms

  datasource:
    url: jdbc:mysql://localhost:3306/farmss_mms?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:your-secret-key-here-change-in-production}
  expiration: 86400000       # 24시간 (ms)
  refresh-expiration: 604800000  # 7일 (ms)

# AI Server
ai-server:
  url: ${AI_SERVER_URL:http://localhost:8000}
  timeout: 60

# Solapi (MMS 발송)
solapi:
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  sender: ${SOLAPI_SENDER:}

# Object Storage
storage:
  base-path: ${STORAGE_PATH:./storage}
  upload-path: ${STORAGE_PATH:./storage}/upload
  generated-path: ${STORAGE_PATH:./storage}/generated

logging:
  level:
    com.agri.mms: DEBUG
    org.springframework.security: INFO
