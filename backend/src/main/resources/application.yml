# 공통 설정 파일입니다.

server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    # 기본 실행 시 MySQL을 사용하는 mysql 프로필을 활성화합니다.
    active: mysql

  jpa:
    # Controller에서 Entity의 지연 로딩이 실행되는 것을 막습니다.
    open-in-view: false

  servlet:
    multipart:
      # 한 개의 업로드 파일 최대 크기입니다.
      max-file-size: 10MB

      # 파일과 요청 데이터를 포함한 전체 요청의 최대 크기입니다.
      max-request-size: 12MB

app:
  upload:
    # 상품 참고 이미지 저장 폴더입니다.
    product-directory: uploads/products

    # OpenAI 생성 이미지 저장 폴더입니다.
    generated-image-directory: uploads/generated

farmms:
  image:
    # mock 또는 openai를 사용할 수 있습니다.
    provider: openai

  mms:
    # mock 또는 solapi를 사용할 수 있습니다.
    provider: solapi

openai:
  # OpenAI API 키는 환경변수에서 가져옵니다.
  api-key: ${OPENAI_API_KEY}

  base-url: https://api.openai.com/v1
  image-model: gpt-image-2
  timeout-seconds: 180

solapi:
  # 솔라피 API Key와 Secret은 환경변수에서 가져옵니다.
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}

  # 모든 FarMMS 회원이 공통으로 사용할
  # 솔라피 등록·승인 완료 대표 발신번호입니다.
  sender-number: ${SOLAPI_SENDER_NUMBER}

logging:
  level:
    com.farmms.backend: debug

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 7200000